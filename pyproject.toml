[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pagestorm"
version = "0.2.0rc1"
description = "Standalone vLLM interface for the Pagestorm story models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "huggingface_hub>=1.31.0",
  "transformers>=5.12.1",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
runtime = [
  "vllm>=0.23.0",
]
dev = [
  "build==1.5.0",
  "mypy==2.3.0",
  "pre-commit==4.6.0",
  "pytest==9.1.1",
  "ruff==0.6.9",
  "torch==2.11.0",
  "twine==6.2.0",
]

[project.scripts]
pagestorm = "pagestorm.cli:main"

[project.entry-points."vllm.general_plugins"]
pagestorm = "pagestorm.vllm_registration:register_pagestorm_vllm_plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["pagestorm", "scripts", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
disable_error_code = ["assignment"]
pretty = true

[tool.setuptools.packages.find]
include = ["pagestorm*"]

[tool.setuptools.package-data]
pagestorm = ["py.typed"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
